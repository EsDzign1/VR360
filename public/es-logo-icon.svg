<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <filter id="pencilNoise" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="3" result="turb" />
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="4" result="disp" />
    </filter>
    <clipPath id="innerCircle">
      <circle cx="100" cy="100" r="96" />
    </clipPath>
  </defs>

  <!-- Clean outer boundary circle with subtle border -->
  <circle cx="100" cy="100" r="96" fill="#ffffff" stroke="#e4e4e7" stroke-width="2" />

  <!-- Organic Charcoal Sketch Blob -->
  <g clip-path="url(#innerCircle)">
    <!-- Base dark charcoal scribble -->
    <path d="M 60,60 
             C 45,78 40,98 44,116 
             C 48,134 62,148 80,154 
             C 98,160 120,158 136,148 
             C 152,136 158,118 156,98 
             C 152,78 140,62 120,54 
             C 100,48 76,50 60,60 Z" 
          fill="#1c1c1e" 
          filter="url(#pencilNoise)" />

    <!-- Charcoal edge strokes -->
    <path d="M 58,68 L 44,82 L 62,79 L 41,94 L 59,93 L 42,108 L 61,107 L 46,122 L 66,120 L 54,134 L 74,132 L 64,145 L 85,141 L 79,152 L 99,148 L 96,158 L 115,152 L 120,159 L 134,148 L 143,153 L 148,139 L 159,137 L 154,124 L 163,117 L 154,105 L 163,95 L 152,86 L 159,75 L 144,70 L 149,59 L 134,57 L 136,46 L 121,50 L 117,40 L 103,46 L 95,38 L 86,47 L 75,42 L 69,52 L 58,51 Z" 
          fill="#1c1c1e" />

    <!-- Center dense oval -->
    <ellipse cx="101" cy="99" rx="46" ry="45" fill="#18181b" filter="url(#pencilNoise)" />

    <!-- Crisp White "ES" Monogram -->
    <text x="86" y="112" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="60" 
          font-weight="300" 
          fill="#ffffff" 
          text-anchor="middle">E</text>
    <text x="119" y="112" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="60" 
          font-weight="300" 
          fill="#ffffff" 
          text-anchor="middle">S</text>
  </g>

  <!-- Delicate outer circle stroke as in original logo -->
  <circle cx="100" cy="100" r="96" fill="none" stroke="#27272a" stroke-width="1.5" />
</svg>
